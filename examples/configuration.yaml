# ---------------------------------------------------------------------------
# 增量片段：粘到 /config/configuration.yaml 末尾（若已有 shell_command: 顶层键，
# 把下面两个子项合并进去，不要重复写 shell_command:）。
#
# 改完需要「开发者工具 → YAML → 检查配置」，再重启 HA 才会注册服务。
# ---------------------------------------------------------------------------
shell_command:
  # 低频补一段 SD 卡录像。--bg 让脚本脱离会话后台运行，
  # 避开 shell_command 内置 60 秒超时（单段实测要 60~90 秒）。
  ezviz_sd_pull: >-
    /bin/sh /config/custom_components/ezviz_lock/tools/run_ezviz_pull.sh
    --bg --limit 1 --event-priority

  # 只做环境自检，不取流。用来确认凭据 / ffmpeg / 目标目录是否就绪。
  ezviz_sd_pull_check: >-
    /bin/sh /config/custom_components/ezviz_lock/tools/run_ezviz_pull.sh
    --check --log-file /config/logs/ezviz_check.log

  # 可选：云存储录像回放（type=3）。开门瞬间短片、自带 AAC 音轨、不打扰设备。
  # 需要设备已开通萤石云存储；与上面的 SD 链路互为兜底，可只启用其中一条。
  ezviz_cloud_pull: >-
    /bin/sh /config/custom_components/ezviz_lock/tools/run_ezviz_cloud_pull.sh
    --bg --limit 1 --event-priority

  ezviz_cloud_pull_check: >-
    /bin/sh /config/custom_components/ezviz_lock/tools/run_ezviz_cloud_pull.sh
    --check --log-file /config/logs/ezviz_cloud_check.log

# 说明：
#  - 脚本默认从 /config/.storage/core.config_entries 读取 AppKey/AppSecret，
#    那正是本集成 ConfigFlow 写入的位置，所以这里不需要写任何密钥。
#  - 若配置目录不是 /config，或想换录像落盘位置，可在命令里加环境变量：
#      EZVIZ_DEST=/media/ezviz_lock
#      EZVIZ_CONFIG_ENTRIES=/path/to/core.config_entries
#      EZVIZ_APP_KEY=... EZVIZ_APP_SECRET=... EZVIZ_SERIAL=...
#    但优先用 core.config_entries，避免密钥出现在 YAML 里。
