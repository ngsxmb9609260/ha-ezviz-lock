- id: '1794500000001'
  alias: 门锁 SD 录像补录（开门即补 + 30 分钟兜底）
  description: 门锁一有开门事件就补一段（先等 3 分钟让设备把这段封口）；另每 30 分钟兜底一次。v1.3.1 起包装器默认把本自动化的触发改道云存储双路补录（SD 单路产出停用），徘徊事件因此也能拿到双路片；把包装器 SD_PULL_ENABLED 改回 1 可恢复单路 SD 链路
  triggers:
  - trigger: time_pattern
    minutes: /30
    id: scan
  - trigger: state
    entity_id: event.y3000fvx_plus_yourserial_door_open_event
    not_to:
    - unknown
    - unavailable
    id: door_event
  - trigger: state
    entity_id: sensor.your_ezviz_lock_loiter_alerts_today
    not_to:
    - unknown
    - unavailable
    id: loiter_event
  conditions:
  - condition: template
    value_template: "{% set tid = trigger.id | default('scan') %} {{ tid == 'scan'\n   or (tid == 'door_event' and trigger.to_state is defined\n       and trigger.to_state.attributes.get('event_type') !=\
      \ 'open_close')\n   or (tid == 'loiter_event' and trigger.from_state is defined and trigger.to_state is defined\n       and (trigger.to_state.state | int(0)) > (trigger.from_state.state | int(0)))\
      \ }}"
  actions:
  - if:
    - condition: template
      value_template: '{{ trigger.id in ["door_event", "loiter_event"] }}'
    then:
    - delay:
        seconds: 180
  - action: shell_command.ezviz_sd_pull
    data: {}
  mode: queued
  max: 2
